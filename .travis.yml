language: php

php:
    - 7.4
    - 8.0
    - 8.1
    - 8.2
    - 8.3

os:
    - linux

dist: focal

matrix:
    fast_finish: true
    allow_failures:
        - php: 8.3

cache:
    directories:
        - $HOME/.composer/cache
        - vendor

before_install:
    - travis_retry composer self-update
    - phpenv config-rm xdebug.ini || true

install:
    - travis_retry composer install --no-interaction --prefer-dist --no-suggest

script:
    - vendor/bin/phpunit --configuration phpunit.xml.dist
    - php tests/comprehensive-verification.php
    - php tests/test-optimized-provider.php

after_success:
    - echo "All tests passed successfully!"

notifications:
    email:
        on_success: change
        on_failure: always

branches:
    only:
        - master
        - main
        - develop
